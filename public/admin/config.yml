# Disable in production
local_backend: true

backend:
  name: git-gateway
  branch: master

media_folder: "public/upload"
public_folder: "/upload"

site_url: https://celestialsynthesis.com

seo: &seo
  name: "SEOmetaData"
  label: "SEO"
  widget: "object"
  collapsed: true
  fields:
    - { name: "metaTitle", label: "SEO Title", widget: "string", default: "{{ title }}", required: true }
    - { name: "metaDescription", label: "SEO Description", widget: "string", pattern: [".{20,160}", "between 20 and 160 characters"], required: true }
    - { name: "metaImage", label: "SEO image", widget: "image", required: false }
    - { name: "keywords", label: "keywords", widget: "string", required: false }

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home"
        file: "content/pages/home.md"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - { name: "content", label: "Content", widget: "markdown" }
          - *seo

  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Short Description", widget: "string" }
      - { name: "image", label: "Feature image", widget: "image", required: false }
      - { name: "content", label: "Content", widget: "markdown" }
      - *seo
